<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NumWorks Storage</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#fafaf9;--panel:#fff;--ink:#1c1917;--mut:#78716c;--line:#e7e5e4;--acc:#e8453c;--accink:#fff;--hover:#f5f5f4;--sel:#fef2f1;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0c0a09;--panel:#171514;--ink:#f5f5f4;--mut:#a8a29e;--line:#292524;--hover:#211f1e;--sel:#2a1514}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s}
button:hover:not(:disabled){background:var(--hover)}button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--accink)}button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--acc)}
button.danger{color:var(--acc)}button.ghost{border-color:transparent;background:transparent}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.on .dot{background:#22c55e}
#status{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px;margin-right:8px}
main{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.ah{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
#list{flex:1;overflow:auto;padding:0 8px}
.it{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer}
.it:hover{background:var(--hover)}.it.sel{background:var(--sel)}
.it b{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.it small{color:var(--mut)}.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--hover);color:var(--mut)}
.mem{padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0}
section{display:flex;flex-direction:column;min-width:0;min-height:0}
.bh{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#nm{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:inherit;flex:1 1 380px;min-width:220px;max-width:680px}
#nm:hover{border-color:var(--mut)}#nm:focus{border-color:var(--acc);outline:none}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;padding:6px 12px}.seg button.on{background:var(--hover);font-weight:600;color:var(--acc)}
label.sw{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;cursor:pointer}
.sp{flex:1}
textarea{flex:1;resize:none;border:0;outline:0;padding:16px;background:transparent;color:inherit;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:4;white-space:pre;overflow:auto}
.foot{padding:6px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
.empty{margin:auto;text-align:center;color:var(--mut);max-width:380px;padding:24px}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:18px}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:20px;width:min(400px,92vw)}
dialog::backdrop{background:#0006}dialog h3{margin:0 0 6px}dialog p{margin:0 0 16px;color:var(--mut)}
dialog .row{display:flex;gap:8px;justify-content:flex-end}
#pdlg{width:min(480px,92vw)}.tools{display:flex;gap:8px;margin-bottom:10px}.tools button{padding:5px 10px;font-size:13px}
#pl{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
#pl label{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer}#pl label:hover{background:var(--hover)}#pl label+label{border-top:1px solid var(--line)}
#pl b{flex:1;font:550 13px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#pl small{color:var(--mut)}
#pl .tag.w{background:var(--sel);color:var(--acc)}
.hx{flex:1;display:flex;gap:18px;overflow:auto;padding:16px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;align-items:flex-start}
.hx pre{margin:0;font:inherit;color:var(--mut);flex:none;user-select:none}#hasc{user-select:text}
#hex{flex:none;width:47ch;padding:0;overflow:hidden;font:inherit;white-space:pre;text-transform:uppercase}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;font-size:13px;max-width:90vw;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:200px 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="brand">⬡ NumWorks Storage</div>
  <div id="status"><span class="dot"></span><span id="st"></span></div>
  <button id="bConn" class="primary" data-i18n="connect"></button>
  <button id="bBackup" disabled data-i18n="backupB"></button>
  <button id="bRestore" disabled data-i18n="restoreB"></button>
  <input type="file" id="fRestore" accept=".nws,.tar" hidden>
  <div class="seg" id="lang" title="Langue / Language"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
</header>
<main>
  <aside>
    <div class="ah"><span><span data-i18n="files"></span> <span id="cnt"></span></span><span><button class="ghost" id="bNew" data-i18n-title="newT" disabled>＋</button><button class="ghost" id="bImp" data-i18n-title="impT" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7 8m5-5 5 5M4 17v3h16v-3"/></svg></button><input type="file" id="fImp" hidden><button class="ghost" id="bRef" data-i18n-title="refresh" disabled>↻</button></span></div>
    <div id="list"></div>
    <div class="mem"><span id="memt">—</span><div class="bar"><i id="memb"></i></div></div>
  </aside>
  <section>
    <div id="none" class="empty"><h2></h2><p></p></div>
    <div id="ed" class="hidden" style="display:contents">
      <div class="bh">
        <input id="nm" spellcheck="false" autocomplete="off" data-i18n-title="nmT">
        <label class="sw" id="autoW"><input type="checkbox" id="auto"> <span data-i18n="auto"></span></label>
        <span class="sp"></span>
        <div class="seg"><button id="mTxt" data-i18n="text" data-i18n-title="textT"></button><button id="mHex" data-i18n-title="hexT">Hex</button></div>
        <button id="bDl" data-i18n="dl"></button>
        <button id="bDel" class="danger" data-i18n="del"></button>
        <button id="bSave" class="primary" disabled data-i18n="save"></button>
      </div>
      <textarea id="code" spellcheck="false"></textarea>
      <div class="hx hidden" id="hx"><pre id="hoff"></pre><textarea id="hex" spellcheck="false" wrap="off"></textarea><pre id="hasc"></pre></div>
      <div class="foot" id="foot"></div>
    </div>
  </section>
</main>
<dialog id="dlg"><form method="dialog"><h3 id="dt"></h3><p id="dx"></p><div class="row"><button value="cancel" data-i18n="cancel"></button><button id="dok" value="ok"></button></div></form></dialog>
<dialog id="pdlg"><form method="dialog"><h3 id="pt"></h3><p id="px"></p>
<div class="tools"><button type="button" id="pAll" data-i18n="all"></button><button type="button" id="pNone" data-i18n="none"></button></div>
<div id="pl"></div><div class="row"><button value="cancel" data-i18n="cancel"></button><button id="pok" value="ok" class="primary"></button></div></form></dialog>
<div id="toast"></div>

  else r.raw=data;return r}
function parse(b){
  if(b.length<6||b[0]!==0xBA||b[1]!==0xDD||b[2]!==0x0B||b[3]!==0xEE)return[];
  const dv=new DataView(b.buffer,b.byteOffset,b.byteLength),out=[];let o=4;
  while(o+2<=b.length){const sz=dv.getUint16(o,true);if(!sz||o+sz>b.length)break;
    let e=o+2;while(e<o+sz&&b[e])e++;
    const full=dec.decode(b.subarray(o+2,e)),data=b.slice(e+1,o+sz),k=full.lastIndexOf('.');
    const r=mkRec(k<0?full:full.slice(0,k),k<0?'':full.slice(k+1),data);
    out.push(r);o+=sz}
  return out;
}
function body(r){if(r.type!=='py')return r.raw;const c=enc.encode(r.code),o=new Uint8Array(r.head.length+c.length+1);o.set(r.head);o.set(c,r.head.length);return o}
const fname=r=>r.type?r.name+'.'+r.type:r.name;
function encode(list,max=Infinity){
  const ps=[new Uint8Array([0xBA,0xDD,0x0B,0xEE])];let n=4;
  for(const r of list){const nm=enc.encode(fname(r)),d=body(r),sz=3+nm.length+d.length,p=new Uint8Array(sz);
    new DataView(p.buffer).setUint16(0,sz,true);p.set(nm,2);p.set(d,3+nm.length);ps.push(p);n+=sz}
  ps.push(new Uint8Array(2));n+=2;
  if(n>max)throw new Error(t('noMem'));
  const out=new Uint8Array(n);let o=0;for(const p of ps){out.set(p,o);o+=p.length}return out;
}
async function readAll(){dev.startAddress=info.addr;recs=parse(new Uint8Array(await(await dev.do_upload(xfer,info.size+8)).arrayBuffer()))}
async function writeAll(list){const b=encode(list,info.size);dev.startAddress=info.addr;await dev.do_download(xfer,b.buffer,false);recs=list}

/* ---------- Archive .nws (tar) ---------- */
function tarMake(files){
  const bl=[],oct=(n,l)=>n.toString(8).padStart(l-1,'0')+'\0';
  for(const f of files){const h=new Uint8Array(512),w=(s,o)=>h.set(enc.encode(s),o);
    w(f.name,0);w('0000644\0',100);w('0000000\0',108);w('0000000\0',116);w(oct(f.data.length,12),124);w(oct(Date.now()/1000|0,12),136);w('        ',148);w('0',156);w('ustar\0',257);w('00',263);
    let s=0;for(const x of h)s+=x;w(s.toString(8).padStart(6,'0')+'\0 ',148);
    bl.push(h,f.data);const p=(512-f.data.length%512)%512;if(p)bl.push(new Uint8Array(p))}
  bl.push(new Uint8Array(1024));return new Blob(bl,{type:'application/x-tar'});
}
function tarRead(b){
  const out=[];let o=0;
  while(o+512<=b.length){const h=b.subarray(o,o+512);if(!h[0])break;
    const s=(a,e)=>dec.decode(h.subarray(a,e)).split('\0')[0],size=parseInt(s(124,136).trim()||'0',8),t=h[156];o+=512;
    if(t===48||t===0)out.push({name:s(0,100).split('/').pop(),data:b.slice(o,o+size)});
    o+=Math.ceil(size/512)*512}
  return out;
}

/* ---------- Rendu ---------- */
function setConn(){
  const c=!!dev;document.body.classList.toggle('on',c);
  $('#st').textContent=c?t('on')+(info.upsilon?' · Upsilon':''):t('off');
  $('#bConn').classList.toggle('hidden',c);
  for(const id of['bBackup','bRestore','bNew','bImp','bRef'])$('#'+id).disabled=!c;
}
function render(){renderList();editor()}
function renderList(){
  const L=$('#list');L.innerHTML='';$('#cnt').textContent=recs.length?'('+recs.length+')':'';
  recs.forEach(r=>{const d=document.createElement('div');d.className='it'+(r===cur?' sel':'');
    const sz=r.type==='py'?enc.encode(r.code).length:r.raw.length;
    d.innerHTML='<b></b>'+(r.type!=='py'?'<span class="tag"></span>':'')+'<small>'+kb(sz)+'</small>';
    d.firstChild.textContent=fname(r);if(r.type!=='py')d.querySelector('.tag').textContent=r.type||'?';
    d.onclick=()=>pick(r);L.appendChild(d)});
  if(dev){const u=encode(recs).length;$('#memt').textContent=kb(u)+' / '+kb(info.size)+' '+t('used');$('#memb').style.width=Math.min(100,u/info.size*100)+'%'}
}
function editor(){
  const has=!!cur;$('#none').classList.toggle('hidden',has);$('#ed').classList.toggle('hidden',!has);
  if(!has){emptyTxt();return}
  const py=cur.type==='py';
  $('#nm').value=fname(cur);fitNm();
  buf=py?body(cur):cur.raw.slice();
  $('#autoW').classList.toggle('hidden',!py);$('#auto').checked=py&&buf[0]!==0;
  showBuf();
  dirty=false;stat();
}
function stat(){
  if(!cur)return;const d=dirty?t('dirty'):'';
  if(mode==='text'){const v=$('#code').value,bad=(v.match(/\uFFFD/g)||[]).length;$('#bSave').disabled=!dirty;
    $('#foot').textContent=v.split('\n').length+' '+t('lines')+' · '+kb(enc.encode(v).length)+d+(bad?' · '+t('bad',bad):'');return}
  const b=parseHex($('#hex').value);$('#bSave').disabled=!dirty||!b;
  $('#foot').textContent=b?b.length+' '+t('bytes')+d:t('hexBad');
}
/* ---- tampon d'octets partagé entre l'éditeur texte et l'éditeur hex ---- */
let mode='text',buf=null,textDirty=false;
const decT=new TextDecoder('utf-8',{ignoreBOM:true}),hdl=()=>info.upsilon?3:1;
function toText(b){const py=cur.type==='py',st=py?hdl():0;let e=b.length;if(py){e=st;while(e<b.length&&b[e])e++}
  return decT.decode(b.subarray(st,e)).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,'\uFFFD')}
function fromText(t){const c=enc.encode(t);if(cur.type!=='py')return c;const h=hdl(),o=new Uint8Array(h+c.length+1);o.set(buf.subarray(0,h));o.set(c,h);return o}
function syncBuf(){if(mode==='hex'){const b=parseHex($('#hex').value);if(!b)return false;buf=b;return true}
  if(textDirty){buf=fromText($('#code').value);textDirty=false}return true}
function showBuf(){
  $('#code').classList.toggle('hidden',mode==='hex');$('#hx').classList.toggle('hidden',mode==='text');
  $('#mTxt').classList.toggle('on',mode==='text');$('#mHex').classList.toggle('on',mode==='hex');
  if(mode==='hex'){$('#hex').value=hexFmt(buf);drawHex()}else{$('#code').value=toText(buf);textDirty=false}
  stat();
}
function setMode(m){if(m===mode)return;if(!syncBuf()){toast(t('hexMode'));return}mode=m;showBuf()}
const fitNm=()=>{};
/* ---- éditeur hexadécimal ---- */
const hexFmt=b=>{const o=[];for(let i=0;i<b.length;i+=16)o.push(Array.from(b.subarray(i,i+16),x=>x.toString(16).padStart(2,'0')).join(' '));return o.join('\n')};
function parseHex(t){if(/[^0-9a-fA-F\s]/.test(t))return null;const h=t.replace(/\s+/g,'');if(h.length%2)return null;
  const b=new Uint8Array(h.length/2);for(let i=0;i<b.length;i++)b[i]=parseInt(h.substr(i*2,2),16);return b}
function drawHex(){
  const t=$('#hex');t.style.height='auto';t.style.height=t.scrollHeight+'px';
  let off=0;const O=[],A=[];
  for(const ln of t.value.split('\n')){const d=ln.replace(/[^0-9a-f]/gi,'');let a='';
    for(let i=0;i+1<d.length;i+=2){const c=parseInt(d.substr(i,2),16);a+=c>=32&&c<127?String.fromCharCode(c):'.'}
    O.push(off.toString(16).padStart(6,'0'));A.push(a);off+=d.length>>1}
  $('#hoff').textContent=O.join('\n');$('#hasc').textContent=A.join('\n');
}
async function pick(r){if(r===cur)return;if(dirty&&!await ask(t('unsavedT'),t('unsavedPick'),t('discard'),true))return;cur=r;render()}

/* ---------- Actions ---------- */
$('#bConn').onclick=()=>run(async()=>{await connect();await readAll();setConn();cur=null;render();toast(t('read',recs.length))});
$('#bRef').onclick=()=>run(async()=>{if(dirty&&!await ask(t('refT'),t('refX'),t('refresh'),true))return;await readAll();cur=null;render();toast(t('refreshed'))});
$('#code').oninput=()=>{dirty=true;textDirty=true;stat()};
$('#hex').oninput=()=>{dirty=true;drawHex();stat()};
$('#hex').onblur=()=>{const b=parseHex($('#hex').value);if(b){$('#hex').value=hexFmt(b);drawHex()}};
$('#mTxt').onclick=()=>setMode('text');$('#mHex').onclick=()=>setMode('hex');
$('#auto').onchange=()=>{if(!syncBuf()){$('#auto').checked=!$('#auto').checked;toast(t('hexInv'));return}
  buf=buf.slice();buf[0]=+$('#auto').checked;if(mode==='hex')showBuf();dirty=true;stat()};
$('#nm').oninput=()=>{fitNm();dirty=true;stat()};
$('#code').onkeydown=e=>{if(e.key==='Tab'&&!e.shiftKey&&!$('#code').readOnly){e.preventDefault();document.execCommand('insertText',false,'    ')}};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(!$('#bSave').disabled)$('#bSave').click()}});
$('#bSave').onclick=()=>run(async()=>{
  const old=cur;if(!syncBuf())throw new Error(t('hexInv'));
  const full=$('#nm').value.trim(),k=full.lastIndexOf('.');
  const type=(k<0?'':full.slice(k+1)).toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!type&&old.type)throw new Error(t('needExt'));
  const raw=k<0?full:full.slice(0,k);
  const name=(type==='py'?raw.toLowerCase().replace(/[^a-z0-9_]/g,'_'):raw.replace(/[.\x00-\x1f\/]/g,'_'))||t('fname');
  if(recs.some(r=>r!==old&&r.name===name&&r.type===type))throw new Error(t('exists',name+(type?'.'+type:'')));
  if(type!==old.type&&!await ask(t('extT'),t('extX',old.type,type),t('change'),true))return;
  const nr=mkRec(name,type,buf),next=recs.map(r=>r===old?nr:r);
  await writeAll(next);cur=nr;render();toast(t('saved'))});
$('#bDel').onclick=()=>run(async()=>{
  if(!await ask(t('delT'),t('delX',fname(cur)),t('del'),true))return;
  const n=fname(cur);await writeAll(recs.filter(r=>r!==cur));cur=null;render();toast(t('deleted',n))});
$('#bDl').onclick=()=>{const py=cur.type==='py';save(new Blob([py?cur.code:cur.raw]),fname(cur))};
$('#bNew').onclick=()=>run(async()=>{
  if(dirty&&!await ask(t('unsavedT'),t('lost'),t('cont'),true))return;
  let i=1;while(recs.some(r=>r.type==='py'&&r.name==='script'+i))i++;
  const r={name:'script'+i,type:'py',code:'',head:new Uint8Array(info.upsilon?3:1)};
  await writeAll([...recs,r]);cur=r;render();$('#code').focus()});
$('#bImp').onclick=()=>$('#fImp').click();
$('#fImp').onchange=e=>run(async()=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(dirty&&!await ask(t('unsavedT'),t('lost'),t('cont'),true))return;
  const k=f.name.lastIndexOf('.'),type=(k<0?'':f.name.slice(k+1)).toLowerCase().replace(/[^a-z0-9]/g,'');
  let name=k<0?f.name:f.name.slice(0,k);
  name=(type==='py'?name.toLowerCase().replace(/[^a-z0-9_]/g,'_'):name.replace(/[.\x00-\x1f\/]/g,'_'))||t('fname');
  const bytes=new Uint8Array(await f.arrayBuffer()),i=recs.findIndex(x=>x.name===name&&x.type===type);
  const r=type==='py'?{name,type,head:i>=0&&recs[i].head?recs[i].head:new Uint8Array(info.upsilon?3:1),code:dec.decode(bytes).replace(/\r\n?/g,'\n')}:{name,type,raw:bytes};
  if(i>=0&&!await ask(t('replT'),t('replX',fname(r)),t('replace'),true))return;
  const next=recs.slice();if(i>=0)next[i]=r;else next.push(r);
  await writeAll(next);cur=r;render();toast(fname(r)+' '+t(i>=0?'replaced':'imported'))});
$('#bBackup').onclick=()=>run(async()=>{
  if(!recs.length)throw new Error(t('noBackup'));
  const idx=await pickFiles(t('backupN'),t('backupX'),recs.map(r=>({label:fname(r),size:kb(fsize(r))})),t('backupN'));
  if(!idx)return;
  const meta={},files=[];
  for(const i of idx){const r=recs[i],n=fname(r);if(r.type==='py'){meta[n]=Array.from(r.head);files.push({name:n,data:enc.encode(r.code)})}else files.push({name:n,data:r.raw})}
  files.push({name:META,data:enc.encode(JSON.stringify(meta))});
  save(tarMake(files),'numworks-'+new Date().toISOString().slice(0,10)+'.nws');toast(t('backedUp',idx.length))});
$('#bRestore').onclick=()=>$('#fRestore').click();
$('#fRestore').onchange=e=>run(async()=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const files=tarRead(new Uint8Array(await f.arrayBuffer())),mf=files.find(x=>x.name===META);
  const meta=mf?JSON.parse(dec.decode(mf.data)):{},list=[];
  for(const x of files){if(x.name===META)continue;const k=x.name.lastIndexOf('.');if(k<0)continue;
    const name=x.name.slice(0,k),type=x.name.slice(k+1);
    if(type==='py'){const h=meta[x.name]||[0],head=new Uint8Array(info.upsilon?3:1);head[0]=h[0]?1:0;if(info.upsilon&&h.length===3)head.set(h);list.push({name,type,head,code:dec.decode(x.data)})}
    else list.push({name,type,raw:x.data})}
  if(!list.length)throw new Error(t('badArc'));
  const same=(a,b)=>a.name===b.name&&a.type===b.type;
  const idx=await pickFiles(t('restoreN'),t('restoreX'),
    list.map(r=>{const ex=recs.some(x=>same(x,r));return{label:fname(r),size:kb(fsize(r)),tag:ex?t('over'):t('new'),warn:ex}}),t('restoreN'));
  if(!idx)return;
  if(dirty&&!await ask(t('unsavedT'),t('lostRestore'),t('cont'),true))return;
  const next=recs.slice();let over=0;
  for(const i of idx){const r=list[i],k=next.findIndex(x=>same(x,r));if(k>=0){next[k]=r;over++}else next.push(r)}
  const key=cur&&fname(cur);await writeAll(next);cur=next.find(r=>fname(r)===key)||null;render();
  toast(t('restored',idx.length,over,idx.length-over))});
navigator.usb&&navigator.usb.addEventListener('disconnect',e=>{if(dev&&dev.device_===e.device){dev=null;recs=[];cur=null;setConn();render();$('#memt').textContent='—';$('#memb').style.width=0;toast(t('disc'))}});
if(!navigator.usb)$('#bConn').disabled=true;
render();applyLang();
window.addEventListener('beforeunload',e=>{if(dirty)e.preventDefault()});
</script>
